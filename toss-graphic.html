<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }

<body>
<svg viewBox="0 0 1932 828" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0D0D1A"/>
<stop offset="100%" stop-color="#0B0B0F"/>
</linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#007AFF" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FF3B30" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
</linearGradient>
<radialGradient id="cg" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
</radialGradient>
<filter id="ts">
<feDropShadow dx="0" dy="3" stdDeviation="12" flood-color="rgba(0,0,0,0.7)"/>
</filter>
</defs>
