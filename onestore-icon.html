<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0D0D1A"/>
<stop offset="100%" stop-color="#0B0B0F"/>
</linearGradient>
<radialGradient id="coin-glow" cx="50%" cy="45%" r="50%">
<stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
<stop offset="60%" stop-color="#FFD700" stop-opacity="0.08"/>
<stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
</radialGradient>
<linearGradient id="glow-red" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FF3B30" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
</linearGradient>
<linearGradient id="glow-blue" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#007AFF" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
</linearGradient>
</defs>

<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="210" r="200" fill="url(#coin-glow)"/>

<g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
<line x1="0" y1="280" x2="512" y2="280"/>
<line x1="0" y1="360" x2="512" y2="360"/>
</g>

<g fill="#ffffff">
<circle cx="60" cy="40" r="1.2" opacity="0.4"/>
<circle cx="440" cy="55" r="1" opacity="0.3"/>
<circle cx="150" cy="60" r="0.8" opacity="0.35"/>
<circle cx="380" cy="30" r="1.1" opacity="0.4"/>
<circle cx="470" cy="120" r="0.7" opacity="0.25"/>
</g>

<line x1="0" y1="310" x2="512" y2="310" stroke="#FF3B30" stroke-width="1.2" stroke-dasharray="8 5" opacity="0.45"/>

<!-- 5 CANDLES -->
<g>
<rect x="20" y="370" width="60" height="90" rx="3" fill="#FF3B30" opacity="0.8"/>
<line x1="50" y1="348" x2="50" y2="370" stroke="#FF3B30" stroke-width="3.5" opacity="0.65"/>
<line x1="50" y1="460" x2="50" y2="480" stroke="#FF3B30" stroke-width="3.5" opacity="0.5"/>
<rect x="20" y="460" width="60" height="52" fill="url(#glow-red)" opacity="0.3"/>
</g>

<g>
<rect x="115" y="320" width="65" height="130" rx="3" fill="#FF3B30" opacity="0.85"/>
<line x1="147" y1="290" x2="147" y2="320" stroke="#FF3B30" stroke-width="4" opacity="0.7"/>
<line x1="147" y1="450" x2="147" y2="475" stroke="#FF3B30" stroke-width="4" opacity="0.5"/>
<rect x="115" y="450" width="65" height="52" fill="url(#glow-red)" opacity="0.35"/>
</g>

<g>
<rect x="218" y="280" width="65" height="70" rx="3" fill="#007AFF" opacity="0.85"/>
<line x1="250" y1="255" x2="250" y2="280" stroke="#007AFF" stroke-width="4" opacity="0.65"/>
<line x1="250" y1="350" x2="250" y2="375" stroke="#007AFF" stroke-width="4" opacity="0.5"/>
<rect x="218" y="350" width="65" height="50" fill="url(#glow-blue)" opacity="0.25"/>
</g>

<g>
<rect x="320" y="240" width="65" height="150" rx="3" fill="#FF3B30" opacity="0.88"/>
<line x1="352" y1="205" x2="352" y2="240" stroke="#FF3B30" stroke-width="4" opacity="0.7"/>
<line x1="352" y1="390" x2="352" y2="420" stroke="#FF3B30" stroke-width="4" opacity="0.5"/>
<rect x="320" y="390" width="65" height="52" fill="url(#glow-red)" opacity="0.35"/>
</g>

<g>
<rect x="425" y="200" width="65" height="100" rx="3" fill="#007AFF" opacity="0.9"/>
<line x1="457" y1="160" x2="457" y2="200" stroke="#007AFF" stroke-width="4.5" opacity="0.7"/>
<line x1="457" y1="300" x2="457" y2="330" stroke="#007AFF" stroke-width="4.5" opacity="0.5"/>
<rect x="425" y="300" width="65" height="50" fill="url(#glow-blue)" opacity="0.3"/>
</g>

<!-- JUMP EFFECTS -->
<path d="M147 290 Q256 60 352 205" stroke="#FFD700" stroke-width="2.5" stroke-dasharray="7 5" fill="none" opacity="0.22"/>

<circle cx="165" cy="258" r="11" fill="#FFD700" opacity="0.05"/>
<circle cx="190" cy="215" r="13" fill="#FFD700" opacity="0.07"/>
<circle cx="215" cy="175" r="15" fill="#FFD700" opacity="0.09"/>
<circle cx="238" cy="145" r="16" fill="#FFD700" opacity="0.11"/>

<circle cx="147" cy="295" r="22" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.13"/>
<circle cx="147" cy="295" r="36" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.06"/>

<g fill="#FFD700">
<circle cx="140" cy="288" r="3" opacity="0.4"/>
<circle cx="155" cy="282" r="2.5" opacity="0.35"/>
<circle cx="138" cy="278" r="2.2" opacity="0.3"/>
<circle cx="158" cy="294" r="2" opacity="0.25"/>
</g>
<g fill="#FF3B30">
<circle cx="150" cy="288" r="2.2" opacity="0.3"/>
<circle cx="136" cy="294" r="1.8" opacity="0.2"/>
</g>

<line x1="244" y1="145" x2="230" y2="170" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
<line x1="248" y1="152" x2="236" y2="176" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.22"/>
<line x1="240" y1="138" x2="225" y2="162" stroke="#FFD700" stroke-width="1" stroke-linecap="round" opacity="0.18"/>

<line x1="242" y1="128" x2="224" y2="132" stroke="rgba(255,255,255,0.16)" stroke-width="2" stroke-linecap="round"/>
<line x1="246" y1="138" x2="230" y2="141" stroke="rgba(255,255,255,0.1)" stroke-width="1.3" stroke-linecap="round"/>

<!-- COIN (no face, no antennae) -->
<g transform="translate(256, 130)">
<circle cx="0" cy="0" r="110" fill="url(#coin-glow)" opacity="0.5"/>
<g transform="rotate(-18)">
<circle cx="0" cy="0" r="72" fill="#FFD700"/>
<circle cx="0" cy="0" r="72" fill="none" stroke="rgba(255,180,0,0.4)" stroke-width="2"/>
<circle cx="0" cy="0" r="52" fill="none" stroke="rgba(255,180,0,0.6)" stroke-width="2.5"/>
<ellipse cx="-16" cy="-22" rx="24" ry="15" transform="rotate(-15,-16,-22)" fill="rgba(255,255,255,0.15)"/>
</g>
</g>

<!-- Sparkles -->
<g fill="#FFD700">
<path d="M340 85 l0 -9 l0 9 l9 0 l-9 0 l0 9 l0 -9 l-9 0z" opacity="0.6"/>
<path d="M318 62 l0 -6 l0 6 l6 0 l-6 0 l0 6 l0 -6 l-6 0z" opacity="0.45"/>
<path d="M178 100 l0 -6 l0 6 l6 0 l-6 0 l0 6 l0 -6 l-6 0z" opacity="0.5"/>
<path d="M200 70 l0 -5 l0 5 l5 0 l-5 0 l0 5 l0 -5 l-5 0z" opacity="0.35"/>
<path d="M295 190 l0 -5 l0 5 l5 0 l-5 0 l0 5 l0 -5 l-5 0z" opacity="0.4"/>
</g>

</svg>
</body>
</html>
