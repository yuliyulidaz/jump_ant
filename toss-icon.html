<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #0B0B0F; overflow: hidden; }
</style>
</head>
<body>
<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0D0D1A"/>
<stop offset="100%" stop-color="#0B0B0F"/>
</linearGradient>
<radialGradient id="cg" cx="50%" cy="42%" r="50%">
<stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
<stop offset="60%" stop-color="#FFD700" stop-opacity="0.08"/>
<stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
</radialGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FF3B30" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
</linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#007AFF" stop-opacity="0.25"/>
<stop offset="100%" stop-color="#007AFF" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- Background -->
<rect width="600" height="600" fill="url(#bg)"/>

<!-- Coin ambient glow - centered -->
<circle cx="300" cy="245" r="235" fill="url(#cg)"/>

<!-- Grid lines -->
<g opacity="0.04" stroke="#fff" stroke-width="0.5">
<line x1="0" y1="328" x2="600" y2="328"/>
<line x1="0" y1="422" x2="600" y2="422"/>
</g>

<!-- Stars -->
<g fill="#fff">
<circle cx="70" cy="47" r="1.6" opacity="0.4"/>
<circle cx="516" cy="64" r="1.4" opacity="0.3"/>
<circle cx="176" cy="70" r="1.2" opacity="0.35"/>
<circle cx="445" cy="35" r="1.5" opacity="0.4"/>
<circle cx="551" cy="140" r="1" opacity="0.25"/>
<circle cx="40" cy="165" r="1.1" opacity="0.3"/>
</g>

<!-- 상한가 line -->
<line x1="0" y1="363" x2="600" y2="363" stroke="#FF3B30" stroke-width="1.4" stroke-dasharray="10 6" opacity="0.45"/>

<!-- 5 CANDLES - proportional to onestore 512x512 (scale 600/512 = 1.172) -->
<!-- C1: 512→x=20,w=60 → 600→x=23,w=70 -->
<g>
<rect x="23" y="433" width="70" height="105" rx="3" fill="#FF3B30" opacity="0.8"/>
<line x1="58" y1="407" x2="58" y2="433" stroke="#FF3B30" stroke-width="4.1" opacity="0.65"/>
<line x1="58" y1="538" x2="58" y2="562" stroke="#FF3B30" stroke-width="4.1" opacity="0.5"/>
<rect x="23" y="538" width="70" height="61" fill="url(#gr)" opacity="0.3"/>
</g>

<!-- C2: 512→x=115,w=65 → 600→x=135,w=76 -->
<g>
<rect x="135" y="375" width="76" height="152" rx="3" fill="#FF3B30" opacity="0.85"/>
<line x1="173" y1="340" x2="173" y2="375" stroke="#FF3B30" stroke-width="4.7" opacity="0.7"/>
<line x1="173" y1="527" x2="173" y2="556" stroke="#FF3B30" stroke-width="4.7" opacity="0.5"/>
<rect x="135" y="527" width="76" height="61" fill="url(#gr)" opacity="0.35"/>
</g>

<!-- C3: 512→x=218,w=65 → 600→x=255,w=76 (blue) -->
<g>
<rect x="255" y="328" width="76" height="82" rx="3" fill="#007AFF" opacity="0.85"/>
<line x1="293" y1="299" x2="293" y2="328" stroke="#007AFF" stroke-width="4.7" opacity="0.65"/>
<line x1="293" y1="410" x2="293" y2="439" stroke="#007AFF" stroke-width="4.7" opacity="0.5"/>
<rect x="255" y="410" width="76" height="59" fill="url(#gb)" opacity="0.25"/>
</g>

<!-- C4: 512→x=320,w=65 → 600→x=375,w=76 (big red) -->
<g>
<rect x="375" y="281" width="76" height="176" rx="3" fill="#FF3B30" opacity="0.88"/>
<line x1="413" y1="240" x2="413" y2="281" stroke="#FF3B30" stroke-width="4.7" opacity="0.7"/>
<line x1="413" y1="457" x2="413" y2="492" stroke="#FF3B30" stroke-width="4.7" opacity="0.5"/>
<rect x="375" y="457" width="76" height="61" fill="url(#gr)" opacity="0.35"/>
</g>

<!-- C5: 512→x=425,w=65 → 600→x=498,w=76 (blue) -->
<g>
<rect x="498" y="234" width="76" height="117" rx="3" fill="#007AFF" opacity="0.9"/>
<line x1="536" y1="187" x2="536" y2="234" stroke="#007AFF" stroke-width="5.3" opacity="0.7"/>
<line x1="536" y1="351" x2="536" y2="386" stroke="#007AFF" stroke-width="5.3" opacity="0.5"/>
<rect x="498" y="351" width="76" height="59" fill="url(#gb)" opacity="0.3"/>
</g>

<!-- JUMP ARC from C2 to C4 -->
<path d="M173 340 Q300 70 413 240" stroke="#FFD700" stroke-width="2.9" stroke-dasharray="8 6" fill="none" opacity="0.22"/>

<!-- Trail glow -->
<circle cx="193" cy="302" r="13" fill="#FFD700" opacity="0.05"/>
<circle cx="222" cy="252" r="15" fill="#FFD700" opacity="0.07"/>
<circle cx="252" cy="205" r="17" fill="#FFD700" opacity="0.09"/>
<circle cx="279" cy="170" r="19" fill="#FFD700" opacity="0.11"/>

<!-- Launch ripples -->
<circle cx="173" cy="345" r="26" fill="none" stroke="#FFD700" stroke-width="1.8" opacity="0.13"/>
<circle cx="173" cy="345" r="42" fill="none" stroke="#FFD700" stroke-width="1.2" opacity="0.06"/>

<!-- Launch particles -->
<g fill="#FFD700">
<circle cx="164" cy="337" r="3.5" opacity="0.4"/>
<circle cx="182" cy="331" r="2.9" opacity="0.35"/>
<circle cx="163" cy="325" r="2.6" opacity="0.3"/>
<circle cx="185" cy="345" r="2.3" opacity="0.25"/>
</g>
<g fill="#FF3B30">
<circle cx="176" cy="338" r="2.6" opacity="0.3"/>
<circle cx="161" cy="345" r="2.1" opacity="0.2"/>
</g>

<!-- Speed lines -->
<line x1="286" y1="170" x2="269" y2="199" stroke="#FFD700" stroke-width="2.3" stroke-linecap="round" opacity="0.28"/>
<line x1="291" y1="178" x2="277" y2="206" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round" opacity="0.22"/>
<line x1="281" y1="162" x2="264" y2="190" stroke="#FFD700" stroke-width="1.2" stroke-linecap="round" opacity="0.18"/>
<line x1="284" y1="150" x2="263" y2="154" stroke="rgba(255,255,255,0.16)" stroke-width="2.3" stroke-linecap="round"/>
<line x1="288" y1="162" x2="269" y2="165" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>

<!-- PLAIN COIN (no face, no antennae) - centered at x=300 -->
<g transform="translate(300, 152)">
<circle cx="0" cy="0" r="129" fill="url(#cg)" opacity="0.5"/>
<g transform="rotate(-18)">
<circle cx="0" cy="0" r="84" fill="#FFD700"/>
<circle cx="0" cy="0" r="84" fill="none" stroke="rgba(255,180,0,0.4)" stroke-width="2.3"/>
<circle cx="0" cy="0" r="61" fill="none" stroke="rgba(255,180,0,0.6)" stroke-width="2.9"/>
<ellipse cx="-19" cy="-26" rx="28" ry="18" transform="rotate(-15,-19,-26)" fill="rgba(255,255,255,0.15)"/>
</g>
</g>

<!-- Sparkles -->
<g fill="#FFD700">
<path d="M398 99 l0 -10 l0 10 l10 0 l-10 0 l0 10 l0 -10 l-10 0z" opacity="0.6"/>
<path d="M373 73 l0 -7 l0 7 l7 0 l-7 0 l0 7 l0 -7 l-7 0z" opacity="0.45"/>
<path d="M208 117 l0 -7 l0 7 l7 0 l-7 0 l0 7 l0 -7 l-7 0z" opacity="0.5"/>
<path d="M234 82 l0 -5 l0 5 l5 0 l-5 0 l0 5 l0 -5 l-5 0z" opacity="0.35"/>
<path d="M345 222 l0 -5 l0 5 l5 0 l-5 0 l0 5 l0 -5 l-5 0z" opacity="0.4"/>
</g>

</svg>
</body>
</html>
